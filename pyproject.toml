[build-system]
requires = ["setuptools>=68,<90"]
build-backend = "setuptools.build_meta"

[project]
name = "baitd"
dynamic = ["version"]
description = "Local app that turns a topic into a short video and cuts clips from long videos"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "flask>=3.1.1,<4",
    "aiohttp>=3.9,<4",         # the live chat readers (websockets and polling)
    "requests>=2.32.4,<3",
    "edge-tts>=7.3,<8",
    "imageio-ffmpeg>=0.8,<1",
    "platformdirs>=4,<5",
    "fonttools>=4.60.2,<5",
    "waitress>=3,<4",
    "yt-dlp>=2026.10,<2027",
    "yt-dlp-ejs>=0.8,<0.9",   # YouTube's JS challenge solver scripts, matched to the yt-dlp above
    "deno>=2.5,<3",           # the JavaScript runtime yt-dlp runs them with (bundled in the app)
    "pywebview>=6.2,<7",      # Baitd's own window (WebView2 on Windows, WebKit on macOS)
    "faster-whisper>=1.2,<2",
    "opencv-python-headless>=5,<6",
    "numpy>=2,<3",
    "cryptography>=44,<51",   # Ed25519: the updater checks the release signature before installing
    "keyring>=25.6,<26",      # API keys in the OS credential store (Credential Manager, Keychain)
    "pynput>=1.7.6,<2; sys_platform != 'win32'",  # the global hotkey on macOS and Linux (Windows uses user32)
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.10,<7"]

[project.scripts]
baitd = "baitd.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
baitd = ["assets/fonts/*.ttf", "assets/fonts/LICENSES/*", "assets/music/*/*.mp3", "assets/music/CREDITS.md", "assets/models/*.onnx", "assets/models/LICENSE-yunet.txt",
              "web/templates/*.html", "web/static/*.css", "web/static/*.js", "web/static/*.png", "web/static/i18n/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -m \"not network\""
pythonpath = ["src"]
markers = ["network: tests that need internet access"]

[tool.setuptools.dynamic]
version = {attr = "baitd.__version__"}
