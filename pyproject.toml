[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baitd"
dynamic = ["version"]
description = "Local app that turns a topic into a short video and cuts clips from long videos"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "flask",
    "requests",
    "edge-tts>=7.3,<8",
    "imageio-ffmpeg>=0.8",
    "platformdirs",
    "fonttools",
    "waitress>=3,<4",
    "yt-dlp>=2026.10,<2027",
    "faster-whisper>=1.2,<2",
    "opencv-python-headless>=5,<6",
    "numpy>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller"]

[project.scripts]
baitd = "baitd.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
baitd = ["assets/fonts/*.ttf", "assets/fonts/LICENSES/*", "assets/music/*/*.mp3", "assets/music/CREDITS.md", "assets/models/*.onnx", "assets/models/LICENSE-yunet.txt",
              "web/templates/*.html", "web/static/*.css", "web/static/*.js", "web/static/i18n/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
pythonpath = ["src"]
markers = ["network: tests that need internet access"]

[tool.setuptools.dynamic]
version = {attr = "baitd.__version__"}
