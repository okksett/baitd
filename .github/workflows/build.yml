name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe: dist/Baitd/Baitd.exe
            artifact: Baitd-windows-x64.zip
          - os: macos-15-intel
            exe: dist/Baitd.app/Contents/MacOS/Baitd
            artifact: Baitd-macos-x64.zip
          - os: macos-15
            exe: dist/Baitd.app/Contents/MacOS/Baitd
            artifact: Baitd-macos-arm64.zip
          - os: ubuntu-22.04
            exe: dist/Baitd/Baitd
            artifact: Baitd-linux-x64.tar.gz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install
        run: |
          # every package, direct or not, at the locked version and hash (uv pip compile ... --generate-hashes)
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Tests (offline, includes the end-to-end smoke test)
        run: pytest -m "not network"

      - name: Build the app
        run: pyinstaller packaging/baitd.spec --noconfirm

      - name: Self-test the frozen app (offline render)
        run: |
          out=$("${{ matrix.exe }}" --selftest)
          echo "$out"
          echo "$out" | grep -q "^SELFTEST OK"

      - name: Launch the frozen app and request the page
        run: |
          "${{ matrix.exe }}" --no-browser --port 18765 > app.log 2>&1 &
          pid=$!
          # Always print the log and clean up, even when curl fails under bash -e.
          cleanup() {
            echo "--- app.log ---"
            cat app.log || true
            # Clean exit through the app's own endpoint, then make sure nothing is left running.
            curl --silent --request POST --header "Content-Type: application/json" --data "{}" \
              http://127.0.0.1:18765/api/shutdown || true
            sleep 2
            kill "$pid" 2>/dev/null || true
            if [ "$RUNNER_OS" = "Windows" ]; then taskkill //F //IM Baitd.exe 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --retry 30 --retry-delay 1 --retry-connrefused --retry-all-errors \
            http://127.0.0.1:18765/ || true)
          echo "GET / -> $status"
          test "$status" = "200"

      - name: Package
        run: |
          case "$RUNNER_OS" in
            Windows) powershell -NoProfile -Command "Compress-Archive -Path dist/Baitd -DestinationPath '${{ matrix.artifact }}'" ;;
            macOS)   ditto -c -k --keepParent dist/Baitd.app "${{ matrix.artifact }}" ;;
            Linux)   tar -czf "${{ matrix.artifact }}" -C dist Baitd ;;
          esac
          ls -l "${{ matrix.artifact }}"

      - name: Size gate (zipped bundle must stay under 450 MB)
        run: |
          size=$(wc -c < "${{ matrix.artifact }}" | tr -d ' ')
          echo "${{ matrix.artifact }}: $((size / 1048576)) MB"
          test "$size" -le $((450 * 1048576)) || { echo "Bundle is over 450 MB"; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

      - name: Build installer (Inno Setup)
        if: runner.os == 'Windows'
        env:
          MSYS_NO_PATHCONV: "1"
        run: |
          choco install innosetup --version=6.7.1 -y --no-progress --allow-downgrade
          VERSION=$(python -c "import baitd; print(baitd.__version__)" | tr -d '\r')
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=$VERSION" packaging/baitd.iss
          ls -l dist-installer/Baitd-Setup.exe

      - name: Installer size gate (must stay under 450 MB)
        if: runner.os == 'Windows'
        run: |
          size=$(wc -c < dist-installer/Baitd-Setup.exe | tr -d ' ')
          echo "Baitd-Setup.exe: $((size / 1048576)) MB"
          test "$size" -le $((450 * 1048576)) || { echo "Installer is over 450 MB"; exit 1; }

      - name: Checksums
        if: runner.os == 'Windows'
        run: |
          # Bare file names in SHA256SUMS: hash both files from one folder.
          cp "${{ matrix.artifact }}" dist-installer/
          cd dist-installer
          sha256sum Baitd-Setup.exe "$(basename '${{ matrix.artifact }}')" > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Windows'
        with:
          name: Baitd-windows-setup
          path: |
            dist-installer/Baitd-Setup.exe
            dist-installer/SHA256SUMS
          if-no-files-found: error

      - name: Installer smoke test (silent install + selftest)
        if: runner.os == 'Windows'
        env:
          MSYS_NO_PATHCONV: "1"
        run: |
          INSTALL_DIR=$(cygpath -w "$RUNNER_TEMP/baitd-install")
          powershell -NoProfile -Command "\$p = Start-Process -Wait -PassThru -FilePath 'dist-installer\Baitd-Setup.exe' -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=$INSTALL_DIR'; exit \$p.ExitCode"
          test -f "$RUNNER_TEMP/baitd-install/Baitd.exe"
          out=$("$RUNNER_TEMP/baitd-install/Baitd.exe" --selftest 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          echo "$out" | grep -q "SELFTEST OK"

  # One SHA256SUMS for all five release files, made from the uploaded artifacts, plus a signed build
  # provenance (GitHub attestation) for pushes; pull requests only get the checksums.
  checksums:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums of every release file
        run: |
          cd dist
          sha256sum Baitd-Setup.exe Baitd-windows-x64.zip Baitd-macos-arm64.zip Baitd-macos-x64.zip             Baitd-linux-x64.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        if: github.event_name != 'pull_request'
        with:
          subject-path: |
            dist/Baitd-Setup.exe
            dist/Baitd-windows-x64.zip
            dist/Baitd-macos-arm64.zip
            dist/Baitd-macos-x64.zip
            dist/Baitd-linux-x64.tar.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Baitd-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error
